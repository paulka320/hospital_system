{% extends 'base.html' %}

{% block content %}

<h2>Reception (Patient Queue)</h2>

<a href="{% url 'add_visit' %}" class="btn btn-primary mb-3">
    Add Visit
</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        {% for visit in visits %}
        <tr>
            <td>{{ visit.patient }}</td>
            <td>{{ visit.doctor }}</td>
            <td>{{ visit.status }}</td>
            <td>{{ visit.visit_date }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No visits yet</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
