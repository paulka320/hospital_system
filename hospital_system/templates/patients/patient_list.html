{% extends 'base.html' %}

{% block content %}

<h2>Patients List</h2>

<a href="{% url 'add_patient' %}" class="btn btn-primary mb-3">Add Patient</a>
<form method="GET"class="mb-3">
    <input type="text"name="q"placeholder="Search patients..."class="form-control"value="{{request.GET.q}}">
</form>

<table class="table table-hover table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Age</th>
            <th>Gender</th>
            <!--<th>Review</th>-->
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for patient in patients %}
        <tr>
            <td>{{ patient.name }}</td>
            <td>{{ patient.phone }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.gender }}</td>
        <td>
        <a href="{% url 'edit_patient' patient.id %}"class="btn btn-warning btn-sm">Edit</a>
        <a href="{% url 'delete_patient' patient.id %}"class="btn btn-danger btn-sm">Delete</a>
        <a href ="{% url 'patient_detail' patient.id %}"class="btn btn-info btn-sm">View</a>
        </td>
        {% empty %}
        <tr>
            <td colspan="3">No patients found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
