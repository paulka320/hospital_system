{% extends 'base.html' %}

{% block content %}

<h2>Create New Bill</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Select Patient</label>

<select name="patient" class="form-control">

{% for patient in patients %}

<option value="{{ patient.id }}">
    {{ patient }}
</option>

{% endfor %}

</select>

</div>

<button type="submit" class="btn btn-success">

Create Bill

</button>

</form>

{% endblock %}
